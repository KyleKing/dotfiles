# Tips:
# - Add post-install hooks with: `mise config set tools.node.postinstall "npm install -g neovim"`
# = Manage environment with `mise set SHEARS_SUBDIR=test` and `mise settings`
# - Share uv-installed Python using `mise sync python --uv`

[env]
MISE_NPM_BUN = "true"
MISE_PYTHON_UV_VENV_AUTO = "true"

[settings]
disable_hints = ["python_multi"]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
pipx_uvx = true

[tools]
python = "3.14.0"
bun = "latest"
"cargo:selene" = "latest"
deno = "latest"
go = "latest"
"go:github.com/Zxilly/go-size-analyzer/cmd/gsa" = "latest"
"go:github.com/boyter/dcd" = "latest"
"go:github.com/dhth/act3" = "latest"
"go:github.com/idursun/jjui/cmd/jjui" = "latest"
"go:github.com/merschformann/gotz" = "latest"
hk = "latest"
lefthook = "latest"
lua-language-server = "latest"
node = "latest"
"npm:@browsermcp/mcp" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:@getgrit/cli" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:@qodo/command" = "latest"
"npm:bash-language-server" = "latest"
"npm:cchistory" = "latest"
"npm:jj-stack" = "latest"
"npm:stylelint" = "latest"
"pipx:beautysh" = "latest"
"pipx:black" = "latest"
"pipx:code2flow" = "latest"
"pipx:copier" = "latest"
"pipx:copier-template-tester" = "latest"
"pipx:em-keyboard" = "latest"
"pipx:git-filter-repo" = "latest"
"pipx:macnotesapp" = "latest"
"pipx:mypy-silent" = "latest"
"pipx:norwegianblue" = "latest"
"pipx:pint" = "latest"
"pipx:pipenv" = "latest"
"pipx:poetry" = {uvx_args = "--with=poetry-plugin-sort --with=poetry-relax --with=poetry-plugin-export", version = "latest"}
"pipx:pygments" = "latest"
"pipx:pylint" = "latest"
"pipx:pyright" = "latest"
"pipx:pysentry-rs" = "latest"
"pipx:pytest-watcher" = "latest"
"pipx:ruff" = "latest"
"pipx:sqlfluff" = "latest"
"pipx:toml-sort" = "latest"
"pipx:tox" = {uvx_args = "--with tox-uv>=1.29.0", version = "latest"}
"pipx:trcli" = "latest"
"pipx:uv-secure" = "latest"
"pipx:watchgha" = "latest"
"pipx:whisperlivekit" = {uvx_args = "--with torchaudio", version = "latest"}
pitchfork = "latest"
pkl = "latest"
ripsecrets = "latest" # pragma: allowlist secret
shellcheck = "latest"
terraform = "latest"
typos = "latest"
watchexec = "latest"
yq = "latest"
