gui:
  scrollHeight: 15 # increased from 2 to match lazygit
  border: "rounded"
  language: "auto"
  theme:
    activeBorderColor: [green, bold]
    inactiveBorderColor: [default]
    selectedLineBgColor: [blue]
    optionsTextColor: [blue]
    searchingActiveBorderColor: [yellow, bold]
  wrapMainPanel: true
  sidePanelWidth: 0.333
  showBottomLine: true
  expandFocusedSidePanel: false
  returnImmediately: true # from chezmoi config
  containerStatusHealthStyle: "short"
  screenMode: "normal"

reporting: "on" # from chezmoi config

stats:
  maxDuration: "3m"
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: cyan
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: green

logs:
  timestamps: false
  since: "60m"
  tail: ""
  viewerCommand: ""
  filters:
    - pattern: "heartbeat"
    - pattern: "\\[DEBUG\\]"
      containers: "web*|*worker*"

commandTemplates:
  dockerCompose: docker compose # from chezmoi config

customCommands:
  containers:
    - name: bash
      attach: true
      command: "docker exec -it {{ .Container.ID }} bash"
    - name: dive
      attach: true
      command: "dive {{ .Container.Image.Name }}"
    - name: sh
      attach: true
      command: "docker exec -it {{ .Container.ID }} sh"
  images:
    - name: dive
      attach: true
      command: "dive {{ .Image.Name }}"
  services: []
  volumes: []
