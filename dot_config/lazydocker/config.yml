gui:
  scrollHeight: 2 # lines to scroll with Ctrl-D/Ctrl-U (already bound by default)
  border: "rounded" # 'rounded' | 'single' | 'double' | 'hidden'
  theme:
    activeBorderColor: [green, bold]
    inactiveBorderColor: [default]
    selectedLineBgColor: [blue]
    optionsTextColor: [blue]
  wrapMainPanel: true
  sidePanelWidth: 0.333
  expandFocusedSidePanel: false # set to true for auto-expand focused panel
  containerStatusHealthStyle: "short" # 'long' | 'short' | 'icon'

stats:
  graphs:
    - caption: CPU (%)
      statPath: DerivedStats.CPUPercentage
      color: cyan
    - caption: Memory (%)
      statPath: DerivedStats.MemoryPercentage
      color: green

logs:
  timestamps: false
  since: "60m" # show logs from last 60 minutes
  tail: "" # optional: limit to N recent lines
  viewerCommand: "" # optional: override pager (default: $PAGER or less)
  filters:
    - pattern: "heartbeat"
    - pattern: "\\[DEBUG\\]"
      containers: "web*|*worker*" # optional: glob patterns separated by |

customCommands:
  containers:
    - name: bash
      attach: true
      command: "docker exec -it {{ .Container.ID }} bash"
    - name: dive
      attach: true
      command: "dive {{ .Container.Image.Name }}"
    - name: sh
      attach: true
      command: "docker exec -it {{ .Container.ID }} sh"
  images:
    - name: dive
      attach: true
      command: "dive {{ .Image.Name }}"
  services: []
  volumes: []
