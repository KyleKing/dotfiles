# T hands the todo set to Claude Code, with the file it wrote as the prompt.
# The tool list is scoped to reading and to this binary: a review agent stages
# comments through second-look and needs nothing else. Widen it deliberately if
# you want the agent running tests.

dispatch = [
  "--chrome",
  "--dangerously-skip-permissions",
  "--model=sonnet",
  "-p",
  "claude",
]
limit = 25
# Once the agent has recorded its session with `second-look session`, T resumes
# that one instead of starting a stranger who has to read the diff again.
resume = [
  "--chrome",
  "--dangerously-skip-permissions",
  "--resume",
  "-p",
  "claude",
  "{session}",
]

[[section]]
name = "my work"
query = "author:@me org:coverbasedev archived:false is:open sort:updated-desc"

[[section]]
name = "needs my review"
query = "review-requested:@me archived:false is:open sort:updated-desc"

[[section]]
name = "my non-work"
query = "author:@me -org:coverbasedev archived:false is:open sort:updated-desc"

[[section]]
name = "work PRs pending review"
query = "org:coverbasedev draft:false -review:approved -author:app/dependabot archived:false is:open sort:updated-desc"
