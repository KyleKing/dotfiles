# Every command below is an argv list, so order matters: never sort these arrays.

# T hands the todo set to Claude Code, with the file it wrote as the prompt.
dispatch = [
  "--chrome",
  "--dangerously-skip-permissions",
  "--model=sonnet",
  "-p",
  "claude",
]
limit = 25
# Once the agent has recorded its session with `second-look session`, T resumes
# that one instead of starting a stranger who has to read the diff again.
resume = [
  "--chrome",
  "--dangerously-skip-permissions",
  "--resume",
  "-p",
  "claude",
  "{session}",
]

# ACP adapters T runs in a pane beside the diff. The first listed is the default
# and SECOND_LOOK_AGENT picks one by name.
[[agent]]
command = ["acp", "devin"]
name = "devin"

[[agent]]
command = ["-y", "@zed-industries/claude-code-acp", "npx"]
name = "claude"
