---
# Common commands:
# prek install -f
# prek autoupdate
# prek run --all-files mdformat
# prek run --all-files --hook-stage commit
# prek run --all-files --hook-stage push
# poetry run calcipy lint.pre-commit --no-update
#
# See https://pre-commit.com for more information
#  and https://pre-commit.com/hooks.html for more hooks
# And: https://prek.j178.dev/builtin

# Only commit is installed by default: https://pre-commit.com/#pre-commit-install
# Pending rename of pre-push from: https://github.com/pre-commit/pre-commit/issues/2732
default_install_hook_types: ["commit-msg", "pre-commit", "pre-push"]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: private_keybindings.json|zed/.*settings\.json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: trailing-whitespace
        exclude: dot_config/my_config/scripts/.+\..+
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - "mdformat-mkdocs[recommended]>=5.0.0"
          - "mdformat-beautysh>=1.0.0" # https://github.com/hukkin/mdformat-beautysh/issues/4
        args: [--wrap=no]
        exclude: _.+\.md|CHANGELOG\.md|CODE_TAG_SUMMARY\.md
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          # Note: this version must be the same as the hook revision
          - "prettier@v4.0.0-alpha.8"
          - "prettier-plugin-sh"
        entry: prettier --write --ignore-unknown
        exclude: \.copier-answers\.yml|.*/cassettes/.*\.yaml|tests/.*assert-cache.*/.+\.json
        types_or: [html, javascript, json, shell, yaml]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort-fix
        args:
          [
            --in-place,
            --all,
            --trailing-comma-inline-array,
            --sort-first=python,
          ]
        exclude: poetry\.lock|superfile/[^\.]+\.toml|dot_config/television/.+\.toml
  - repo: https://github.com/KyleKing/calcipy
    rev: 5.0.0
    hooks:
      - id: copier-forbidden-files
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Can't generate baseline with Py 3.8. Use exclude regex rules instead
      # See: https://github.com/Yelp/detect-secrets/issues/452
      - id: detect-secrets
        # args: ["--baseline", ".secrets.baseline"]
        exclude: poetry\.lock|.*/cassettes/.*\.yaml
        stages:
          - pre-push
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.3.1
    hooks:
      - id: stylua-system
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets-system
  - repo: local
    hooks:
      - id: selene
        name: Selene
        description: Lints Lua files using Selene (install with homebrew)
        entry: selene
        language: system
        types: [lua]
