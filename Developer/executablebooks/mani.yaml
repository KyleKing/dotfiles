---
projects:
  mdformat-deflist:
    url: git@github.com:executablebooks/mdformat-deflist.git
  mdformat-footnote:
    url: git@github.com:executablebooks/mdformat-footnote.git
  mdformat-myst:
    url: git@github.com:executablebooks/mdformat-myst.git
  mdit-py-plugins:
    url: git@github.com:executablebooks/mdit-py-plugins.git

tasks:
  git-status:
    desc: show working tree status
    output: table
    parallel: true
    cmd: git status

  git-pull:
    desc: pull remote updates. Exit 0 on error
    parallel: true
    cmd: git pull || true

  git-ahead-behind:
    desc: show commits ahead/behind the upstream branch
    output: table
    parallel: true
    cmd: |
      git fetch --quiet 2>/dev/null || true
      AHEAD=$(git rev-list --count '@{upstream}..HEAD' 2>/dev/null || echo "?")
      BEHIND=$(git rev-list --count 'HEAD..@{upstream}' 2>/dev/null || echo "?")
      echo "ahead=$AHEAD behind=$BEHIND"

  gpoi:
    desc: Run GH poi to remove closed branches
    cmd: |
      COUNT=$(git branch --format='%(HEAD) %(refname:short) -> %(upstream:short)' | wc -l)
      if (("$COUNT" > 1)); then git checkout main && gh poi && git pull; else echo "No change; only one checked out branch"; fi
