tasks:
  git-status:
    desc: show working tree status
    output: table
    parallel: true
    cmd: |
      if [ -d .jj ]; then jj status; else git status; fi

  git-pull:
    desc: pull remote updates. Exit 0 on error
    parallel: true
    cmd: |
      if [ -d .jj ]; then jj git fetch --config git.abandon-unreachable-commits=false || true; else git pull || true; fi

  git-ahead-behind:
    desc: show commits ahead/behind trunk (jj) or the upstream branch (git)
    output: table
    parallel: true
    cmd: |
      if [ -d .jj ]; then
        jj git fetch --config git.abandon-unreachable-commits=false --quiet 2>/dev/null || true
        AHEAD=$(jj log -r 'trunk()..@' --no-graph -T 'commit_id ++ "\n"' 2>/dev/null | wc -l | tr -d ' ')
        BEHIND=$(jj log -r '@..trunk()' --no-graph -T 'commit_id ++ "\n"' 2>/dev/null | wc -l | tr -d ' ')
      else
        git fetch --quiet 2>/dev/null || true
        AHEAD=$(git rev-list --count '@{upstream}..HEAD' 2>/dev/null || echo "?")
        BEHIND=$(git rev-list --count 'HEAD..@{upstream}' 2>/dev/null || echo "?")
      fi
      echo "ahead=$AHEAD behind=$BEHIND"

  gpoi:
    desc: Run GH poi to remove closed branches
    parallel: true
    cmd: |
      COUNT=$(git branch --format='%(HEAD) %(refname:short) -> %(upstream:short)' | wc -l)
      if (("$COUNT" > 1)); then
        if [ -d .jj ]; then jj new main && gh poi && jj git fetch --config git.abandon-unreachable-commits=false; else git checkout main && gh poi && git pull; fi
      else
        echo "No change; only one checked out branch"
      fi

  git-prune:
    desc: remove local branches and tags which have been deleted on remote
    parallel: true
    env:
      remote: origin
    cmd: |
      if [ -d .jj ]; then jj git fetch --config git.abandon-unreachable-commits=false; else git fetch --prune --prune-tags; fi

  git-daily:
    desc: show branch, local and remote diffs, last commit and date
    parallel: true
    commands:
      - name: branch
        cmd: |
          if [ -d .jj ]; then jj log -r 'heads(::@- & bookmarks())' --no-graph -T 'bookmarks'; else git rev-parse --abbrev-ref HEAD; fi

      - name: status
        cmd: |
          if [ -d .jj ]; then jj status; else git status; fi

      - name: local diff
        cmd: |
          if [ -d .jj ]; then jj diff --name-only | wc -l; else git diff --name-only | wc -l; fi

      - name: remote diff
        cmd: |
          if [ -d .jj ]; then
            jj log -r 'trunk()..@' --no-graph -T 'commit_id ++ "\n"' 2>/dev/null | wc -l
          else
            current_branch=$(git rev-parse --abbrev-ref HEAD)
            git diff "$current_branch" "origin/$current_branch" --name-only 2> /dev/null | wc -l
          fi

      - name: last commit
        cmd: |
          if [ -d .jj ]; then jj log -r '@-' --no-graph -T 'description'; else git log -1 --pretty=%B; fi

      - name: commit date
        cmd: |
          if [ -d .jj ]; then
            jj log -r '@-' --no-graph -T 'committer.timestamp().format("%d %b %y")'
          else
            git log -1 --format="%cd (%cr)" -n 1 --date=format:"%d  %b %y" | sed 's/ //'
          fi

  uv-update:
    desc: "Run `uv update`. Run with: `mani run uv-update --tags=calcipy-template`"
    parallel: true
    cmd: |
      uv lock --upgrade && uv sync
      ./run pack.install-extras
      ./run main --keep-going

      git branch uv-update
      git checkout uv-update
      git push -u origin "$(git rev-parse --abbrev-ref HEAD)"
      git add .
      git commit --message="ci: uv update"
      git push
      gh pr create --assignee="@me" --title="uv Update" --web
      git status
    shell: zsh

  copier-auto-update:
    desc: "Run `copier-auto-update`. Run with: `mani run copier-auto-update --tags=calcipy-template`"
    parallel: true
    cmd: |
      copier update --UNSAFE --conflict=rej --defaults
      git status
    shell: zsh
